<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f5f5f5; margin: 0; }
        .container { width: 400px; padding: 20px; background: white; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); text-align: center; }
        h2 { color: #28a745; }
        p { font-size: 18px; color: #555; }
        .home-button { width: 100%; padding: 10px; background-color: #007bff; color: white; font-size: 16px; border: none; border-radius: 4px; cursor: pointer; margin-top: 20px; }
        .home-button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Payment Successful!</h2>
        <p>Thank you for your payment.</p>
        <p><strong>Amount Paid:</strong> Rs <span id="paid-amount"></span></p>
        <button class="home-button" onclick="goToHome()">Go to Home</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const totalPrice = urlParams.get('totalPrice');
        document.getElementById('paid-amount').textContent = totalPrice;

        function goToHome() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
